  try {
    const bin = atob(BOOM_B64), u8 = new Uint8Array(bin.length);
    for (let i = 0; i < bin.length; i++) u8[i] = bin.charCodeAt(i);

let ry0 = 0, targetY = 0;
const rocketY = () => ry0;

function start() {
  state = 'play'; score = 0; level = 1; progress = 0; runStars = 0; levelProg = 0; levelEnding = false; levelTime = 0;
  lives = 4; combo = 0; mult = 1; invuln = 0; shipTier = 0; rushT = 0; rushAcc = 0;
  enemies = []; bullets = []; powerups = []; texts = []; shocks = [];
  boss = null; alien = null; ally = []; allyT = 0; quiz = null; fires = [];
  doubleT = 0; rapidT = 0; beamT = 0; magnetT = 0; buddyT = 0;
  tripleT = 0; slowT = 0; shield = false; holeT = 0; hole.vis = 0;
  spawnT = 1; powerT = 3; fireT = 0; warp = 1; shake = 0; alienT = rand(45, 60);
  rx = targetX = W / 2; ry0 = targetY = H - 78 * S;
  sfx.level();
}

function gameOver() {
  state = 'over'; overT = 0; shake = 1; flash = 1;
  if (score > best) { best = score; save('bhb_best', best); }
  sfx.over();
}

/* ---------- helpers ---------- */
function burst(x, y, col, n, sp) {
  for (let i = 0; i < n; i++) {
    const a = rand(0, TAU), v = rand(0.2, 1) * (sp || 260);
    parts.push({ x, y, vx: Math.cos(a) * v, vy: Math.sin(a) * v, life: 0, max: rand(0.3, 0.8), col, s: rand(1.5, 4) });
  }
}
function floatText(x, y, str, col) { texts.push({ x, y, str, col, life: 0 }); }

function addCombo() {
  combo++;
  const m = Math.min(5, 1 + Math.floor(combo / 5));
  if (m > mult) { mult = m; floatText(rx, rocketY() - 90 * S, 'x' + m + '!', LASER[m - 1][0]); sfx.power(); }
}
function addProgress(n) {
  progress += n;
  if (levelEnding) return;
  levelProg += n;
}

function hurt(n) {
  if (invuln > 0 || state !== 'play') return;
  if (shield) {
    shield = false; invuln = 0.9; sfx.shield();
    shocks.push({ x: rx, y: rocketY(), r: 10, max: W * 0.5, life: 0, dur: 0.5, col: '125,255,154' });
    floatText(rx, rocketY() - 80 * S, 'SHIELD SAVED YOU', '#7dff9a');
    return;
  }
  lives = Math.max(0, lives - n);
  if (shipTier > 0) shipTier--;
  combo = 0; mult = 1; invuln = 1.8; shake = 0.6; flash = 0.45; sfx.hit();
  burst(rx, rocketY(), '#ff4a2a', 40, 420);
  if (lives <= 0) gameOver();
}

/* ---------- enemies ---------- */
function makeEnemy(kind, o) {
  const verts = [];
  for (let i = 0; i < 9; i++) verts.push(rand(0.72, 1.1));
  const floor = H - 6;
  const base = Math.max(3.8, 7.2 - level * 0.3) * rand(0.9, 1.15);
  enemies.push({
    kind, big: !!o.big, R: o.R, r: o.R,
    sx: o.sx, x: o.sx, y0: o.y0, y: o.y0, tx: o.tx,
    t: 0, dur: Math.max(1.2, base * (floor - o.y0) / (H + 34)),
    rot: rand(0, TAU), vr: rand(-2, 2), verts, trail: 0,
    sway: rand(-40, 40), ph: rand(0, TAU)
  });
}
function spawnNormal(rockOnly) {
  const isStar = !rockOnly && Math.random() < 0.21;
  const big = !isStar && level >= 2 && Math.random() < 0.2;
  makeEnemy(isStar ? 'star' : 'rock', {
    sx: rand(W * 0.08, W * 0.92), tx: rand(W * 0.08, W * 0.92), y0: -50,
    R: (isStar ? 24 : big ? 46 : 27) * S, big
  });
}

function destroyRock(e, bySuck, noSplit) {
  e.dead = true;
  burst(e.x, e.y, '#ffb070', e.big ? 34 : 22, 320);
  burst(e.x, e.y, '#ffffff', 8, 160);
  shocks.push({ x: e.x, y: e.y, r: e.r, max: e.r * 3.2, life: 0, dur: 0.35, col: '255,150,80' });
  if (!bySuck) {
    sfx.rock(e.big);
    score += mult; addCombo(); addProgress(1);
    if (e.big && !noSplit) {
      for (let i = 0; i < 2; i++) {
        makeEnemy('rock', { sx: e.x + (i ? 14 : -14), y0: e.y, tx: clamp(e.x + (i ? 1 : -1) * rand(70, 200), 20, W - 20), R: 24 * S });
      }
      floatText(e.x, e.y, 'SPLIT!', '#ffd2a8');
    }
  } else { score += 1; addProgress(1); }
}

function catchStar(e) {
  e.dead = true;
  burst(e.x, e.y, '#ffe36b', 26, 340);
  shocks.push({ x: e.x, y: e.y, r: e.r, max: e.r * 3, life: 0, dur: 0.35, col: '255,227,107' });
  const pts = 3 * mult;
  score += pts; addCombo(); addProgress(1);
  runStars++; totalStars++; save('bhb_stars', totalStars);
  floatText(e.x, e.y - 10, '+' + pts, '#ffe36b');
  sfx.coin();
}

/* ---------- boss ---------- */
function spawnBoss() {
  const R = 84 * S, verts = [];
  for (let i = 0; i < 14; i++) verts.push(rand(0.88, 1.06));
  const hp = Math.round(8 + level * 2) * 3 * 5;   // 5x tougher
  boss = { x: W / 2, y: -R, R, hp, max: hp, hit: 0, verts, rot: 0, fireT: 3.5 };
  floatText(W / 2, H * 0.62, 'BIG ROCK INCOMING', '#ff8a2a');
  shake = 0.5; sfx.boss();
}
function killBoss() {
  const b = boss; boss = null; fires = [];
  burst(b.x, b.y, '#ffb070', 80, 520); burst(b.x, b.y, '#ffffff', 30, 300);
  shocks.push({ x: b.x, y: b.y, r: b.R, max: b.R * 5, life: 0, dur: 0.7, col: '255,160,80' });
  shake = 0.9; flash = 0.6; lastCrunch = 0; sfx.rock(true);
  const pts = 10 * mult; score += pts; addCombo(); addCombo(); addProgress(3);
  floatText(b.x, Math.max(80, b.y), 'BIG ROCK DOWN  +' + pts, '#ffffff');
  const y0 = Math.max(b.y, 0);
  for (let i = 0; i < 6; i++) makeEnemy('rock', { sx: b.x + (i - 2.5) * 20, y0, tx: W * (0.1 + 0.16 * i), R: 24 * S });
  startQuiz(true);
}

/* ---------- alien ---------- */
function spawnAlien() {
  const left = Math.random() < 0.5;
  alien = { x: left ? -70 : W + 70, by: H * rand(0.16, 0.28), y: 0, vx: (left ? 1 : -1) * rand(70, 100) * S, ph: 0, wob: 0, laugh: 0, gave: false };
  sfx.hello();
}

/* ---------- powerups ---------- */
const PTYPES = [
  { id: 'triple', col: '#7df9ff', label: 'TRIPLE BLAST' },
  { id: 'double', col: '#ffb36a', label: 'DOUBLE FIRE' },
  { id: 'shield', col: '#7dff9a', label: 'SHIELD' },
  { id: 'slow',   col: '#c59bff', label: 'SLOW MOTION' },
  { id: 'hole',   col: '#ff8a2a', label: 'BLACK HOLE' },
  { id: 'heart',  col: '#ff5f7e', label: '+1 HEART' },
  { id: 'rapid',  col: '#ffe36b', label: 'RAPID FIRE' },
  { id: 'beam',   col: '#ff6ad5', label: 'MEGA BEAM' },
  { id: 'nova',   col: '#ffffff', label: 'STAR NOVA' },
  { id: 'magnet', col: '#6ab7ff', label: 'STAR MAGNET' },
  { id: 'buddy',  col: '#b6ff6a', label: 'WINGMEN' }
];
function spawnPowerup(x, y) {
  const bag = [];
  PTYPES.forEach(p => { const w = p.id === 'heart' ? (lives < 3 ? 4 : 1) : (p.id === 'triple' || p.id === 'double') ? 6 : 2; for (let i = 0; i < w; i++) bag.push(p); });
  const p = bag[(Math.random() * bag.length) | 0];
  powerups.push({ type: p, x: x === undefined ? rand(W * 0.12, W * 0.88) : x, y: y === undefined ? -30 : y, vy: rand(55, 80), ph: rand(0, TAU), r: 20 * S, bx: 0 });
}
function applyPower(p) {
  const id = p.type.id;
  sfx.power();
  burst(p.x, p.y, p.type.col, 26, 300);
  floatText(p.x, p.y, p.type.label, p.type.col);
  shipUp();
  if (id === 'triple') tripleT = 20;
  else if (id === 'double') doubleT = 20;
  else if (id === 'slow') slowT = 6;
  else if (id === 'shield') { shield = true; sfx.shield(); }
  else if (id === 'hole') { holeT = 4; shake = 0.3; sfx.spit(); }
  else if (id === 'rapid') rapidT = 8;
  else if (id === 'beam') beamT = 4;
  else if (id === 'magnet') magnetT = 9;
  else if (id === 'buddy') buddyT = 12;
  else if (id === 'nova') {
    shocks.push({ x: rx, y: rocketY(), r: 20, max: Math.max(W, H) * 1.1, life: 0, dur: 0.8, col: '255,255,255' });
    for (const e of enemies) if (e.kind === 'rock' && !e.dead && !e.sucked) destroyRock(e, false, true);
    if (boss) { boss.hp -= boss.max * 0.05; boss.hit = 0.15; if (boss.hp <= 0) killBoss(); }
    shake = 0.7; flash = 0.6;
  }
  else if (id === 'heart') { if (lives < MAX_LIVES) lives++; else { score += 5; floatText(p.x, p.y - 30, 'HEARTS FULL  +5', '#ff5f7e'); } }
}

      if (fx * fx + fy * fy < (f.r + 8) ** 2) { b.dead = true; f.dead = true; burst(f.x, f.y, '#ffd27a', 18, 280); sfx.hit(); break; }
    }
  }
  fires = fires.filter(f => !f.dead);

  // alien (friendly)
  alienT -= dt;
  if (alienT <= 0 && !alien) { spawnAlien(); alienT = rand(55, 80); }
  if (alien) {
    const a = alien;
    a.x += a.vx * dt; a.ph += dt; a.wob = Math.max(0, a.wob - dt * 2); a.laugh = Math.max(0, a.laugh - dt);
    a.y = a.by + Math.sin(a.ph * 2.2) * 14 * S;
    allyT -= dt;
    if (allyT <= 0 && a.x > 0 && a.x < W) {
      const tg = pickRock();
      if (tg) { tg.tgt = true; ally.push({ x: a.x + Math.sign(a.vx) * 30 * S, y: a.y - 10 * S, tg }); allyT = 0.7; }
      else allyT = 0.2;
    }
    if (!a.gave && ((a.vx > 0 && a.x > W * 0.5) || (a.vx < 0 && a.x < W * 0.5))) {
      a.gave = true; spawnPowerup(a.x, a.y + 30 * S);
      floatText(a.x, a.y - 56 * S, 'A GIFT FOR YOU', '#9dff9d'); sfx.hello();
    }
    if ((a.vx > 0 && a.x > W + 80) || (a.vx < 0 && a.x < -80)) alien = null;
  }

  // alien helper shots
  for (const sh of ally) {
    let tg = sh.tg;
    if (!tg || tg.dead || tg.sucked) { tg = pickRock(); sh.tg = tg; if (tg) tg.tgt = true; }
    if (!tg) { sh.dead = true; continue; }
    const dx = tg.x - sh.x, dy = tg.y - sh.y, d = Math.hypot(dx, dy) || 1, sp = 700 * S * dt;
    sh.x += dx / d * sp; sh.y += dy / d * sp;
    parts.push({ x: sh.x, y: sh.y, vx: rand(-20, 20), vy: rand(-20, 20), life: 0, max: 0.3, col: '#9dff9d', s: 3 });
    if (d < tg.r + 10) { sh.dead = true; burst(sh.x, sh.y, '#9dff9d', 10, 200); destroyRock(tg, false); }
  }
  ally = ally.filter(sh => !sh.dead);

  // bullets vs alien / boss / rocks / powerups
  for (const b of bullets) {
    if (b.dead) continue;
    if (alien) {
      const dx = (b.x - alien.x) / (46 * S), dy = (b.y - alien.y) / (42 * S);
      if (dx * dx + dy * dy < 1) {
        b.dead = true; alien.wob = 1;
        burst(b.x, b.y, '#ff9ad0', 6, 120);
        if (alien.laugh <= 0) { floatText(alien.x, alien.y - 56 * S, 'HEY, FRIENDLY!', '#9dff9d'); alien.laugh = 1.2; }
        continue;
      }
    }
    if (boss) {
      const dx = boss.x - b.x, dy = boss.y - b.y, rr = boss.R + 6;
      if (dx * dx + dy * dy < rr * rr) {
        b.dead = true; boss.hp--; boss.hit = 0.1;
        burst(b.x, b.y, '#ffb070', 6, 220); sfx.hit();
        if (boss.hp <= 0) killBoss();
        continue;
      }
    }
    for (const e of enemies) {
      if (e.dead || e.kind !== 'rock' || e.sucked || e.y < 0) continue;
      const dx = e.x - b.x, dy = e.y - b.y, rr = e.r + 7;
      if (dx * dx + dy * dy < rr * rr) { b.dead = true; destroyRock(e, false); break; }
    }
    if (b.dead) continue;
    for (const p of powerups) {
      if (p.dead) continue;
      const dx = p.x + p.bx - b.x, dy = p.y - b.y, rr = p.r + 8;
      if (dx * dx + dy * dy < rr * rr) { b.dead = true; p.dead = true; applyPower(p); break; }
    }
  }
  enemies = enemies.filter(e => !e.dead);

  // powerups drift down through the background
  powerT -= dt;
  if (powerT <= 0) { spawnPowerup(); powerT = rand(5, 8); }
  for (const p of powerups) {
    p.y += p.vy * dt; p.ph += dt * 2;
    p.bx = Math.sin(p.ph) * 30;
    const dx = p.x + p.bx - rx, dy = p.y - ry;
    if (!p.dead && dx * dx + dy * dy < (p.r + 34 * S) ** 2) { p.dead = true; applyPower(p); }
    if (p.y > H + 40) p.dead = true;
  }
  powerups = powerups.filter(p => !p.dead);
}

/* ---------- drawing ---------- */
function heartPath(x, y, s) {
  ctx.beginPath();
  ctx.moveTo(x, y + s * 0.9);
  ctx.bezierCurveTo(x - s * 1.5, y - s * 0.2, x - s * 0.7, y - s * 1.2, x, y - s * 0.35);
  ctx.bezierCurveTo(x + s * 0.7, y - s * 1.2, x + s * 1.5, y - s * 0.2, x, y + s * 0.9);
  ctx.closePath();
}

function drawBackground() {
  ctx.fillStyle = '#000'; ctx.fillRect(0, 0, W, H);
  const m = Math.max(W, H);
  for (const n of nebulae) {
    const g = ctx.createRadialGradient(n.x * W, n.y * H, 0, n.x * W, n.y * H, n.r * m);
    g.addColorStop(0, 'rgba(' + n.c + ',0.16)'); g.addColorStop(1, 'rgba(' + n.c + ',0)');
    ctx.fillStyle = g; ctx.fillRect(0, 0, W, H);
  }
  ctx.lineCap = 'round';
  for (const s of stars) {
    const x = s.x * W, y = s.y * H;
    const a = (0.35 + 0.65 * s.z) * (0.7 + 0.3 * Math.sin(time * 2 + s.tw));
    const len = warp * s.z * 160;
    if (len > 2) {
      ctx.strokeStyle = 'rgba(190,220,255,' + a + ')'; ctx.lineWidth = 1 + s.z * 1.4;
      ctx.beginPath(); ctx.moveTo(x, y - len); ctx.lineTo(x, y); ctx.stroke();
    } else {
      ctx.fillStyle = 'rgba(255,255,255,' + a + ')';
      ctx.beginPath(); ctx.arc(x, y, 0.6 + s.z * 1.8, 0, TAU); ctx.fill();
    }
  }
  for (const c of comets) {
    const g = ctx.createLinearGradient(c.x, c.y, c.x - c.vx * 0.16, c.y - c.vy * 0.16);
    g.addColorStop(0, 'rgba(255,255,255,0.9)'); g.addColorStop(1, 'rgba(120,180,255,0)');
    ctx.strokeStyle = g; ctx.lineWidth = 2.5;
    ctx.beginPath(); ctx.moveTo(c.x, c.y); ctx.lineTo(c.x - c.vx * 0.16, c.y - c.vy * 0.16); ctx.stroke();
  }
}

function drawHole() {
  if (hole.vis <= 0.01) return;
  ctx.save();
  ctx.globalAlpha = hole.vis;
  drawHoleBody(hole.r * (0.3 + 0.7 * hole.vis) * (1 + hole.pulse * 0.1 + Math.sin(time * 1.5) * 0.015));
  ctx.restore();
}
function drawHoleBody(r) {
  const { x, y } = hole;
  const g = ctx.createRadialGradient(x, y, r * 0.9, x, y, r * 2.6);
  g.addColorStop(0, 'rgba(255,130,40,' + (0.38 + hole.pulse * 0.3) + ')');
  g.addColorStop(0.4, 'rgba(255,90,30,0.1)'); g.addColorStop(1, 'rgba(255,90,30,0)');
  ctx.fillStyle = g; ctx.beginPath(); ctx.arc(x, y, r * 2.6, 0, TAU); ctx.fill();

  for (const o of orbit) {
    const ox = x + Math.cos(o.a) * r * o.d, oy = y + Math.sin(o.a) * r * o.d * 0.92;
    ctx.fillStyle = 'rgba(140,140,140,0.9)';
    ctx.beginPath(); ctx.arc(ox, oy, o.s * S, 0, TAU); ctx.fill();
  }

  ctx.save();
  ctx.shadowColor = '#ff7a1a'; ctx.shadowBlur = 30 + hole.pulse * 30;
  ctx.fillStyle = '#000'; ctx.strokeStyle = '#ff8a2a'; ctx.lineWidth = 5 * S;
  ctx.beginPath(); ctx.arc(x, y, r, 0, TAU); ctx.fill(); ctx.stroke();
  ctx.translate(x, y); ctx.rotate(0.42);
  ctx.lineWidth = 6 * S; ctx.lineJoin = 'round';
  ctx.beginPath();
  for (let i = 0; i <= 60; i++) {
    const a = (i / 60) * TAU;
    const wob = 1 + Math.sin(a * 5 + time * 1.2) * 0.03;
    const px = Math.cos(a) * r * 1.42 * wob, py = Math.sin(a) * r * 0.2 * wob;
    if (i === 0) ctx.moveTo(px, py); else ctx.lineTo(px, py);
  }
  ctx.closePath(); ctx.stroke();
  ctx.restore();
}

function drawEnemy(e) {
  ctx.save();
  ctx.translate(e.x, e.y); ctx.rotate(e.rot);
  if (e.kind === 'star') {
    ctx.shadowColor = '#ffd84a'; ctx.shadowBlur = 22;
    ctx.fillStyle = '#fff4b8'; ctx.strokeStyle = '#ffc928'; ctx.lineWidth = 2.5;
    ctx.beginPath();
    for (let i = 0; i < 10; i++) {
      const a = (i / 10) * TAU - Math.PI / 2, rr = i % 2 ? e.r * 0.48 : e.r * 1.1;
      ctx.lineTo(Math.cos(a) * rr, Math.sin(a) * rr);
    }
    ctx.closePath(); ctx.fill(); ctx.stroke();
  } else {
    ctx.shadowColor = e.big ? '#ff3a1a' : '#ff6a1a'; ctx.shadowBlur = e.big ? 24 : 16;
    ctx.fillStyle = e.big ? '#7a6f6a' : '#8b9099'; ctx.strokeStyle = e.big ? '#d8c4b8' : '#c9ced6'; ctx.lineWidth = 2;
    ctx.beginPath();
    for (let i = 0; i < e.verts.length; i++) {
      const a = (i / e.verts.length) * TAU;
      ctx.lineTo(Math.cos(a) * e.r * e.verts[i], Math.sin(a) * e.r * e.verts[i]);
    }
    ctx.closePath(); ctx.fill(); ctx.stroke();
    ctx.shadowBlur = 0; ctx.fillStyle = 'rgba(0,0,0,0.28)';
    ctx.beginPath(); ctx.arc(-e.r * 0.25, -e.r * 0.15, e.r * 0.22, 0, TAU); ctx.fill();
    ctx.beginPath(); ctx.arc(e.r * 0.3, e.r * 0.25, e.r * 0.15, 0, TAU); ctx.fill();
    if (e.big) { // a crack that shows it will split
      ctx.strokeStyle = 'rgba(255,140,60,0.9)'; ctx.lineWidth = 2.5;
      ctx.beginPath(); ctx.moveTo(-e.r * 0.1, -e.r * 0.9); ctx.lineTo(e.r * 0.1, -e.r * 0.3); ctx.lineTo(-e.r * 0.15, e.r * 0.2); ctx.lineTo(e.r * 0.05, e.r * 0.9); ctx.stroke();
    }
  }
  ctx.restore();
}

/* health bar that floats above the big rock and follows it */
function drawFires() {
  ctx.save(); ctx.globalCompositeOperation = 'lighter';
  if (boss && boss.fireT < 0.5 && boss.y > 0) {
    const k = 1 - boss.fireT / 0.5, cx = boss.x, cy = boss.y + boss.R * 0.4, g = ctx.createRadialGradient(cx, cy, 0, cx, cy, boss.R * 0.55);
    g.addColorStop(0, 'rgba(255,210,90,' + 0.9 * k + ')'); g.addColorStop(1, 'rgba(255,90,20,0)');
    ctx.fillStyle = g; ctx.beginPath(); ctx.arc(cx, cy, boss.R * 0.55, 0, TAU); ctx.fill();
  }
  for (const f of fires) {
    const fl = 1 + Math.sin(time * 40 + f.x) * 0.12, r = f.r * 3 * fl, g = ctx.createRadialGradient(f.x, f.y, 0, f.x, f.y, r);
    g.addColorStop(0, 'rgba(255,240,170,1)'); g.addColorStop(0.35, 'rgba(255,130,30,0.75)'); g.addColorStop(1, 'rgba(255,60,10,0)');
    ctx.fillStyle = g; ctx.beginPath(); ctx.arc(f.x, f.y, r, 0, TAU); ctx.fill();
    ctx.fillStyle = '#fff6d0'; ctx.beginPath(); ctx.arc(f.x, f.y, f.r * 0.55, 0, TAU); ctx.fill();
  }
  ctx.restore();
}
function drawBossBar(b) {
  const frac = clamp(b.hp / b.max, 0, 1);
  if (b.shown === undefined) b.shown = frac;
  b.shown = Math.max(frac, b.shown - 0.35 * (1 / 60));            // trailing "damage" chunk drains after the hit
  const bw = Math.max(150 * S, b.R * 1.9), bh = 12 * S;
  const x = clamp(b.x, bw / 2 + 12, W - bw / 2 - 12) - bw / 2;
  const above = b.y - b.R * 1.12 - 14 * S;
  const y = above > 120 * S ? above : b.y + b.R * 1.12 + 26 * S;     // sit under the rock until there's room above it
  const col = frac > 0.6 ? '#5be86a' : frac > 0.3 ? '#ffd23f' : '#ff4a2a';
  ctx.save();
  // label + percent
  ctx.font = '400 ' + Math.round(15 * S) + 'px ' + DISPLAY; ctx.textBaseline = 'bottom'; ctx.lineJoin = 'round';
  ctx.lineWidth = 4 * S; ctx.strokeStyle = INK;
  ctx.textAlign = 'left'; ctx.strokeText('BIG ROCK', x, y - 3 * S); ctx.fillStyle = '#ffffff'; ctx.fillText('BIG ROCK', x, y - 3 * S);
  const pct = Math.ceil(frac * 100) + '%';
  ctx.textAlign = 'right'; ctx.strokeText(pct, x + bw, y - 3 * S); ctx.fillStyle = col; ctx.fillText(pct, x + bw, y - 3 * S);
  // frame
  ctx.fillStyle = INK; ctx.fillRect(x - 3 * S, y - 3 * S, bw + 6 * S, bh + 6 * S);
  ctx.fillStyle = '#2a2440'; ctx.fillRect(x, y, bw, bh);
  // damage trail, then current health
  ctx.fillStyle = '#ffffff'; ctx.globalAlpha = 0.55; ctx.fillRect(x, y, bw * b.shown, bh); ctx.globalAlpha = 1;
  ctx.shadowColor = col; ctx.shadowBlur = 10 * S;
  ctx.fillStyle = b.hit > 0 ? '#ffffff' : col; ctx.fillRect(x, y, bw * frac, bh);
  ctx.shadowBlur = 0;
  ctx.fillStyle = 'rgba(255,255,255,0.28)'; ctx.fillRect(x, y, bw * frac, bh * 0.4);   // gloss
  // ticks every 10%
  ctx.fillStyle = 'rgba(20,16,46,0.6)';
  for (let i = 1; i < 10; i++) ctx.fillRect(x + bw * i / 10 - 1, y, 2, bh);
  ctx.restore();
}

function drawBoss(b) {
  ctx.save();
  ctx.translate(b.x, b.y); ctx.rotate(b.rot);
  const R = b.R, frac = b.hp / b.max;
  ctx.shadowColor = '#ff4a1a'; ctx.shadowBlur = 40;
  ctx.fillStyle = b.hit > 0 ? '#c9b8ae' : '#6d625d'; ctx.strokeStyle = '#d8c4b8'; ctx.lineWidth = 3;
  ctx.beginPath();
  for (let i = 0; i < b.verts.length; i++) {
    const a = (i / b.verts.length) * TAU;
    ctx.lineTo(Math.cos(a) * R * b.verts[i], Math.sin(a) * R * b.verts[i]);
  }
  ctx.closePath(); ctx.fill(); ctx.stroke();
  ctx.shadowBlur = 0;
  ctx.fillStyle = 'rgba(0,0,0,0.25)';
  [[-0.5, -0.45, 0.16], [0.55, 0.4, 0.2], [-0.35, 0.55, 0.12], [0.5, -0.55, 0.1]].forEach(c => {
    ctx.beginPath(); ctx.arc(R * c[0], R * c[1], R * c[2], 0, TAU); ctx.fill();
  });
  // cracks grow as it takes damage
  const cr = Math.floor((1 - frac) * 8);
  ctx.strokeStyle = '#ff9a3a'; ctx.lineWidth = 3; ctx.shadowColor = '#ff7a1a'; ctx.shadowBlur = 10;
  for (let i = 0; i < cr; i++) {
    const a = i * 0.78 + 0.3;
    ctx.beginPath(); ctx.moveTo(Math.cos(a) * R * 0.15, Math.sin(a) * R * 0.15);
    ctx.lineTo(Math.cos(a + 0.2) * R * 0.5, Math.sin(a + 0.2) * R * 0.5);
    ctx.lineTo(Math.cos(a - 0.1) * R * 0.95, Math.sin(a - 0.1) * R * 0.95); ctx.stroke();
  }
  ctx.shadowBlur = 0;
  // grumpy but silly face
  ctx.fillStyle = '#fff';
  ctx.beginPath(); ctx.arc(-R * 0.28, -R * 0.12, R * 0.15, 0, TAU); ctx.arc(R * 0.28, -R * 0.12, R * 0.15, 0, TAU); ctx.fill();
  ctx.fillStyle = '#111';
  ctx.beginPath(); ctx.arc(-R * 0.26, -R * 0.08, R * 0.07, 0, TAU); ctx.arc(R * 0.3, -R * 0.08, R * 0.07, 0, TAU); ctx.fill();
  ctx.strokeStyle = '#111'; ctx.lineWidth = 5; ctx.lineCap = 'round';
  ctx.beginPath(); ctx.moveTo(-R * 0.45, -R * 0.34); ctx.lineTo(-R * 0.15, -R * 0.26); ctx.moveTo(R * 0.45, -R * 0.34); ctx.lineTo(R * 0.15, -R * 0.26); ctx.stroke();
  ctx.beginPath(); ctx.arc(0, R * 0.42, R * 0.22, Math.PI * 1.15, Math.PI * 1.85); ctx.stroke();
  ctx.restore();
}

function drawAlien(a) {
  if (ready(ASTRO)) {
    ctx.save();
    ctx.translate(a.x, a.y); ctx.rotate(Math.sin(a.ph * 3) * 0.06 + a.wob * Math.sin(time * 40) * 0.15); ctx.scale(S, S);
    if (a.vx < 0) ctx.scale(-1, 1);              // face the way it's flying
    const aw = 96, ah = aw * ASTRO.naturalHeight / ASTRO.naturalWidth;
    ctx.drawImage(ASTRO, -aw / 2, -ah / 2, aw, ah);
    ctx.restore();
    return;
  }
  ctx.save();
  ctx.translate(a.x, a.y); ctx.rotate(Math.sin(a.ph * 4) * 0.08 + a.wob * Math.sin(time * 40) * 0.2); ctx.scale(S, S);
  ctx.shadowColor = '#9dff9d'; ctx.shadowBlur = 22;
  ctx.fillStyle = 'rgba(160,255,190,0.35)'; ctx.strokeStyle = '#9dff9d'; ctx.lineWidth = 2;
  ctx.beginPath(); ctx.arc(0, -4, 17, Math.PI, 0); ctx.fill(); ctx.stroke();
  ctx.shadowBlur = 0;
  ctx.fillStyle = '#5be88a'; ctx.beginPath(); ctx.arc(0, -6, 10, 0, TAU); ctx.fill();
  ctx.fillStyle = '#fff'; ctx.beginPath(); ctx.arc(-4, -8, 3.2, 0, TAU); ctx.arc(4, -8, 3.2, 0, TAU); ctx.fill();
  ctx.fillStyle = '#111'; ctx.beginPath(); ctx.arc(-3.6, -8, 1.5, 0, TAU); ctx.arc(4.4, -8, 1.5, 0, TAU); ctx.fill();
  ctx.strokeStyle = '#111'; ctx.lineWidth = 1.5;
  ctx.beginPath(); ctx.arc(0, -4, a.laugh > 0 ? 4 : 3, 0.2, Math.PI - 0.2); ctx.stroke();
  ctx.shadowColor = '#bcd'; ctx.shadowBlur = 10;
  ctx.fillStyle = '#aab4c4'; ctx.beginPath(); ctx.ellipse(0, 2, 38, 10, 0, 0, TAU); ctx.fill();
  ctx.shadowBlur = 0; ctx.fillStyle = '#7c879a'; ctx.beginPath(); ctx.ellipse(0, 5, 30, 6, 0, 0, Math.PI); ctx.fill();
  const lc = ['#ff5f7e', '#ffe36b', '#7df9ff', '#7dff9a'];
  for (let i = 0; i < 5; i++) {
    ctx.fillStyle = lc[(i + Math.floor(time * 6)) % 4];
    ctx.beginPath(); ctx.arc(-24 + i * 12, 3, 2.4, 0, TAU); ctx.fill();
  }
  ctx.restore();
}

function drawPowerup(p) {
  const x = p.x + p.bx, y = p.y, r = p.r, c = p.type.col;
  ctx.save();
  ctx.translate(x, y);
  ctx.shadowColor = c; ctx.shadowBlur = 24;
  ctx.strokeStyle = c; ctx.lineWidth = 3;
  ctx.fillStyle = 'rgba(0,0,0,0.55)';
  ctx.beginPath(); ctx.arc(0, 0, r * (1 + Math.sin(time * 5) * 0.06), 0, TAU); ctx.fill(); ctx.stroke();
  ctx.save(); ctx.rotate(time * 1.5); ctx.setLineDash([5, 7]); ctx.lineWidth = 1.5;
  ctx.beginPath(); ctx.arc(0, 0, r * 1.35, 0, TAU); ctx.stroke(); ctx.restore();
  ctx.lineWidth = 3; ctx.lineCap = 'round'; ctx.fillStyle = c;
  const id = p.type.id, q = r * 0.5;
  ctx.beginPath();
  if (id === 'triple') {
    ctx.moveTo(-q, q * 0.6); ctx.lineTo(-q * 1.2, -q * 0.6);
    ctx.moveTo(0, q * 0.8); ctx.lineTo(0, -q);
    ctx.moveTo(q, q * 0.6); ctx.lineTo(q * 1.2, -q * 0.6);
    ctx.stroke();
  } else if (id === 'shield') {
    ctx.arc(0, q * 0.5, q * 1.1, Math.PI * 1.1, Math.PI * 1.9); ctx.stroke();
    ctx.beginPath(); ctx.arc(0, q * 0.4, 3, 0, TAU); ctx.fill();
  } else if (id === 'slow') {
    ctx.arc(0, 0, q, 0, TAU); ctx.moveTo(0, 0); ctx.lineTo(0, -q * 0.7); ctx.moveTo(0, 0); ctx.lineTo(q * 0.5, 0); ctx.stroke();
  } else if (id === 'double') {
    ctx.moveTo(-q * 0.5, q * 0.8); ctx.lineTo(-q * 0.5, -q); ctx.moveTo(q * 0.5, q * 0.8); ctx.lineTo(q * 0.5, -q); ctx.stroke();
  } else if (id === 'rapid') {
    for (let i = 0; i < 3; i++) { const yy = q * 0.8 - i * q * 0.75; ctx.moveTo(-q * 0.8, yy); ctx.lineTo(0, yy - q * 0.5); ctx.lineTo(q * 0.8, yy); }
    ctx.stroke();
  } else if (id === 'beam') {
    ctx.moveTo(0, -q * 1.2); ctx.lineTo(0, q * 0.4); ctx.stroke();
    ctx.beginPath(); ctx.arc(0, q * 0.85, q * 0.35, 0, TAU); ctx.fill();
  } else if (id === 'nova') {
    for (let i = 0; i < 8; i++) { const a = (i / 8) * TAU; ctx.moveTo(Math.cos(a) * q * 0.55, Math.sin(a) * q * 0.55); ctx.lineTo(Math.cos(a) * q * 1.2, Math.sin(a) * q * 1.2); }
    ctx.stroke();
    ctx.beginPath(); ctx.arc(0, 0, q * 0.3, 0, TAU); ctx.fill();
  } else if (id === 'magnet') {
    ctx.arc(0, -q * 0.1, q * 0.9, 0, Math.PI);
    ctx.moveTo(-q * 0.9, -q * 0.1); ctx.lineTo(-q * 0.9, -q * 0.95);
    ctx.moveTo(q * 0.9, -q * 0.1); ctx.lineTo(q * 0.9, -q * 0.95);
    ctx.stroke();
  } else if (id === 'buddy') {
    ctx.arc(-q * 0.9, q * 0.3, q * 0.3, 0, TAU);
    ctx.moveTo(q * 1.2, q * 0.3); ctx.arc(q * 0.9, q * 0.3, q * 0.3, 0, TAU);
    ctx.fill();
    ctx.beginPath(); ctx.arc(0, -q * 0.2, q * 0.45, 0, TAU); ctx.stroke();
  } else if (id === 'heart') {
    heartPath(0, 0, q * 0.9); ctx.fill();
  } else {
    ctx.arc(0, 0, q * 0.75, 0, TAU); ctx.stroke();
    ctx.beginPath(); ctx.ellipse(0, 0, q * 1.35, q * 0.3, 0.42, 0, TAU); ctx.stroke();
  }
  ctx.restore();
}

function drawRocket(x, y, sk, lean) {
  const cols = skinCols(sk);
  ctx.save();
  ctx.translate(x, y); ctx.scale(S, S);
  ctx.rotate(clamp(lean * 0.004, -0.3, 0.3));
  const fl = 26 + Math.sin(time * 40) * 6 + Math.random() * 5;
  const g = ctx.createRadialGradient(0, 34, 0, 0, 34, 60);
  g.addColorStop(0, 'rgba(255,170,60,0.55)'); g.addColorStop(1, 'rgba(255,120,30,0)');
  ctx.fillStyle = g; ctx.beginPath(); ctx.arc(0, 34, 60, 0, TAU); ctx.fill();
  ctx.fillStyle = '#ff7a1a';
  ctx.beginPath(); ctx.moveTo(-10, 28); ctx.quadraticCurveTo(0, 28 + fl * 1.5, 10, 28); ctx.fill();
  ctx.fillStyle = '#ffe36b';
  ctx.beginPath(); ctx.moveTo(-5, 28); ctx.quadraticCurveTo(0, 28 + fl * 0.9, 5, 28); ctx.fill();
  const ship = state !== 'start' && shipTier > 0 ? SHIPS[shipTier - 1] : sk === 0 ? BASE_SHIP : null;
  let ringR = 54, ringY = 0;
  if (ship && ready(ship)) {
    const sw = 84 + shipTier * 5, sh = sw * ship.naturalHeight / ship.naturalWidth;
    ctx.drawImage(ship, -sw / 2, 30 - sh, sw, sh);
    ringR = Math.max(54, sw / 2 + 8); ringY = 30 - sh / 2;
  } else {
  ctx.fillStyle = cols[0];
  ctx.beginPath(); ctx.moveTo(-14, 6); ctx.lineTo(-30, 32); ctx.lineTo(-12, 26); ctx.closePath(); ctx.fill();
  ctx.beginPath(); ctx.moveTo(14, 6); ctx.lineTo(30, 32); ctx.lineTo(12, 26); ctx.closePath(); ctx.fill();
  ctx.shadowColor = 'rgba(160,220,255,0.8)'; ctx.shadowBlur = 14;
  ctx.fillStyle = '#f2f4f7';
  ctx.beginPath(); ctx.moveTo(0, -44);
  ctx.bezierCurveTo(20, -24, 18, 10, 13, 30); ctx.lineTo(-13, 30);
  ctx.bezierCurveTo(-18, 10, -20, -24, 0, -44); ctx.fill();
  ctx.shadowBlur = 0;
  ctx.fillStyle = cols[0];
  ctx.beginPath(); ctx.moveTo(0, -44); ctx.bezierCurveTo(8, -36, 12, -28, 13.5, -22); ctx.lineTo(-13.5, -22);
  ctx.bezierCurveTo(-12, -28, -8, -36, 0, -44); ctx.fill();
  ctx.fillStyle = '#2a3340'; ctx.beginPath(); ctx.arc(0, -6, 9, 0, TAU); ctx.fill();
  ctx.fillStyle = '#39b8ff'; ctx.beginPath(); ctx.arc(0, -6, 6.5, 0, TAU); ctx.fill();
  ctx.fillStyle = 'rgba(255,255,255,0.7)'; ctx.beginPath(); ctx.arc(-2, -8, 2, 0, TAU); ctx.fill();
  ctx.fillStyle = cols[1]; ctx.fillRect(-13, 24, 26, 6);
  }
  if (shield && state === 'play') {
    ctx.strokeStyle = 'rgba(125,255,154,' + (0.5 + Math.sin(time * 8) * 0.3) + ')'; ctx.lineWidth = 3;
    ctx.shadowColor = '#7dff9a'; ctx.shadowBlur = 16;
    ctx.beginPath(); ctx.arc(0, ringY, ringR, 0, TAU); ctx.stroke();
  }
  ctx.restore();
}

function drawText(str, x, y, size, col, glow) {
  ctx.save();
  ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
  if (size >= 26 * S) {
    ctx.font = '400 ' + size + 'px ' + DISPLAY;
    ctx.lineJoin = 'round'; ctx.lineWidth = Math.max(3, size * 0.14); ctx.strokeStyle = INK;
    if (glow) { ctx.shadowColor = glow; ctx.shadowBlur = 18; }
    ctx.strokeText(str, x, y);
    ctx.shadowBlur = 0;
    ctx.fillStyle = col; ctx.fillText(str, x, y);
  } else {
    ctx.font = '800 ' + size + 'px ' + FONT;
    if (glow) { ctx.shadowColor = glow; ctx.shadowBlur = 24; }
    ctx.fillStyle = col; ctx.fillText(str, x, y);
  }
  ctx.restore();
}

/* ---------- title badge: winged plate, chunky slanted letters ---------- */
function chunky(str, x, y, size, top, bottom) {
  ctx.font = '400 ' + size + 'px ' + DISPLAY;
  ctx.textAlign = 'center'; ctx.textBaseline = 'middle'; ctx.lineJoin = 'round';
  ctx.fillStyle = INK; ctx.fillText(str, x, y + size * 0.09);              // drop
  ctx.lineWidth = size * 0.2; ctx.strokeStyle = INK; ctx.strokeText(str, x, y);
  const g = ctx.createLinearGradient(0, y - size * 0.45, 0, y + size * 0.45);
  g.addColorStop(0, top); g.addColorStop(0.55, top); g.addColorStop(0.56, bottom); g.addColorStop(1, bottom);
  ctx.fillStyle = g; ctx.fillText(str, x, y);
}
function drawLogo(cx, cy, s) {
  ctx.save();
  ctx.font = '400 ' + s * 1.25 + 'px ' + DISPLAY; const w2 = ctx.measureText('BLASTER').width;
  ctx.font = '400 ' + s * 0.8 + 'px ' + DISPLAY;  const w1 = ctx.measureText('BLACK HOLE').width;
  let pw = Math.max(w1, w2) + s * 1.0, wing = s * 1.5;
  const k = Math.min(1, (W * 0.94) / (pw + wing * 2));
  ctx.translate(cx, cy + Math.sin(time * 2) * 3 * S); ctx.scale(k, k);
  const ph = s * 2.3, hw = pw / 2, hh = ph / 2, c = s * 0.45;

  // wings: three gold stripes each side, shortest at the bottom
  for (const side of [-1, 1]) for (let i = 0; i < 3; i++) {
    const y0 = -s * 0.5 + i * s * 0.36, t = s * 0.22, len = wing * (1 - i * 0.22), x0 = hw - s * 0.3, sl = s * 0.18;
    ctx.beginPath();
    ctx.moveTo(side * x0, y0); ctx.lineTo(side * (x0 + len), y0 - sl);
    ctx.lineTo(side * (x0 + len - s * 0.12), y0 + t - sl); ctx.lineTo(side * x0, y0 + t);
    ctx.closePath();
    const wg = ctx.createLinearGradient(0, y0 - sl, 0, y0 + t);
    wg.addColorStop(0, '#fff3b0'); wg.addColorStop(1, '#f39a1e');
    ctx.fillStyle = wg; ctx.fill();
    ctx.lineWidth = s * 0.07; ctx.strokeStyle = INK; ctx.stroke();
  }

  // plate: chamfered shield
  const plate = () => {
    ctx.beginPath();
    ctx.moveTo(-hw + c, -hh); ctx.lineTo(hw - c, -hh); ctx.lineTo(hw, -hh + c);
    ctx.lineTo(hw, hh - c * 1.3); ctx.lineTo(hw - c * 1.6, hh); ctx.lineTo(-hw + c * 1.6, hh);
    ctx.lineTo(-hw, hh - c * 1.3); ctx.lineTo(-hw, -hh + c); ctx.closePath();
  };
  plate();
  ctx.lineJoin = 'round';
  ctx.shadowColor = 'rgba(255,120,40,0.6)'; ctx.shadowBlur = 30 * S;
  ctx.lineWidth = s * 0.34; ctx.strokeStyle = INK; ctx.stroke();
  ctx.shadowBlur = 0;
  ctx.lineWidth = s * 0.17;
  const rim = ctx.createLinearGradient(0, -hh, 0, hh);
  rim.addColorStop(0, '#ffe680'); rim.addColorStop(1, '#e07b10');
  ctx.strokeStyle = rim; ctx.stroke();
  const fill = ctx.createLinearGradient(0, -hh, 0, hh);
  fill.addColorStop(0, '#e8262d'); fill.addColorStop(0.5, '#b3121c'); fill.addColorStop(1, '#5e0712');
  ctx.fillStyle = fill; ctx.fill();
  // gloss across the top half
  ctx.save(); plate(); ctx.clip();
  ctx.fillStyle = 'rgba(255,255,255,0.12)'; ctx.fillRect(-hw, -hh, pw, hh * 0.9);
  ctx.restore();
  ctx.lineWidth = Math.max(1.5, s * 0.035); ctx.strokeStyle = 'rgba(255,255,255,0.55)';
  ctx.save(); ctx.scale((hw - s * 0.14) / hw, (hh - s * 0.14) / hh); plate(); ctx.restore(); ctx.stroke();

  // lettering, slanted like an arcade cabinet
  ctx.transform(1, 0, -0.14, 1, 0, 0);
  chunky('BLACK HOLE', 0, -s * 0.5, s * 0.8, '#ffffff', '#cfe9ff');
  chunky('BLASTER', 0, s * 0.42, s * 1.25, '#ffe24a', '#ff8a1a');
  ctx.restore();
}

function drawSkinPicker() {
  const lay = skinLayout();
  lay.forEach((l, i) => {
    const s = SKINS[i], open = s.cost <= totalStars, cols = skinCols(i);
    ctx.save();
    ctx.translate(l.x, l.y);
    ctx.globalAlpha = open ? 1 : 0.45;
    if (i === skin) { ctx.shadowColor = '#fff'; ctx.shadowBlur = 20; ctx.strokeStyle = '#fff'; ctx.lineWidth = 3; ctx.beginPath(); ctx.arc(0, 0, l.r + 6, 0, TAU); ctx.stroke(); }
    ctx.shadowBlur = 0;
    ctx.fillStyle = '#10131c'; ctx.beginPath(); ctx.arc(0, 0, l.r, 0, TAU); ctx.fill();
    if (open && i === 0 && ready(BASE_SHIP)) {
      const iw = l.r * 1.55, ih = iw * BASE_SHIP.naturalHeight / BASE_SHIP.naturalWidth;
      ctx.drawImage(BASE_SHIP, -iw / 2, -ih / 2, iw, ih);
    } else if (open) {
      ctx.fillStyle = '#f2f4f7'; ctx.beginPath(); ctx.ellipse(0, 2, l.r * 0.28, l.r * 0.55, 0, 0, TAU); ctx.fill();
      ctx.fillStyle = cols[0];
      ctx.beginPath(); ctx.moveTo(0, -l.r * 0.78); ctx.lineTo(l.r * 0.28, -l.r * 0.3); ctx.lineTo(-l.r * 0.28, -l.r * 0.3); ctx.fill();
      ctx.beginPath(); ctx.moveTo(-l.r * 0.2, l.r * 0.4); ctx.lineTo(-l.r * 0.55, l.r * 0.7); ctx.lineTo(-l.r * 0.15, l.r * 0.6); ctx.fill();
      ctx.beginPath(); ctx.moveTo(l.r * 0.2, l.r * 0.4); ctx.lineTo(l.r * 0.55, l.r * 0.7); ctx.lineTo(l.r * 0.15, l.r * 0.6); ctx.fill();
      ctx.fillStyle = cols[1]; ctx.beginPath(); ctx.arc(0, 0, l.r * 0.12, 0, TAU); ctx.fill();
    } else {
      ctx.font = '800 ' + Math.round(13 * S) + 'px ' + FONT; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
      ctx.fillStyle = '#ffe36b'; ctx.fillText('★' + s.cost, 0, 0);
    }
    ctx.restore();
  });
}

function drawQuiz() {
  ctx.fillStyle = 'rgba(0,0,12,0.82)'; ctx.fillRect(0, 0, W, H);
  drawText('MATH TIME', W / 2, H * 0.1, 22 * S, '#ffd23f', '#ffd23f');
  drawText(quiz.q, W / 2, H * 0.23, 78 * S, '#ffffff', '#ffd23f');
  drawText(quiz.wrong ? 'Not quite. Try again.' : 'Get it right and every rock is gone', W / 2, H * 0.33, 18 * S, quiz.wrong ? '#ff9a8a' : 'rgba(255,255,255,0.6)');
  const bw = 150 * S, bh = Math.min(70 * S, H * 0.09), dx = quiz.shake > 0 ? Math.sin(quiz.shake * 60) * 8 : 0;
  ctx.save(); ctx.translate(dx, 0);
  ctx.shadowColor = quiz.wrong && quiz.shake > 0 ? '#ff5f5f' : '#ffd23f'; ctx.shadowBlur = 18;
  ctx.strokeStyle = quiz.wrong && quiz.shake > 0 ? '#ff5f5f' : '#ffd23f'; ctx.lineWidth = 3;
  ctx.beginPath(); ctx.roundRect(W / 2 - bw / 2, H * 0.4 - bh / 2, bw, bh, 12); ctx.stroke();
  ctx.restore();
  const cur = Math.floor(time * 2) % 2 ? '_' : ' ';
  drawText(quiz.typed + (quiz.typed.length < 2 ? cur : ''), W / 2 + dx, H * 0.4, 46 * S, '#ffffff');
  for (const k of quizKeys()) {
    ctx.save();
    ctx.strokeStyle = 'rgba(255,210,63,0.8)'; ctx.fillStyle = k.c === 'ok' ? 'rgba(255,210,63,0.22)' : 'rgba(255,210,63,0.08)'; ctx.lineWidth = 2;
    ctx.beginPath(); ctx.roundRect(k.x, k.y, k.w, k.h, 10); ctx.fill(); ctx.stroke();
    ctx.restore();
    drawText(k.label || k.c, k.x + k.w / 2, k.y + k.h / 2, 28 * S, '#ffffff');
  }
  // country of the moment, so kids get to know the flags
  const ks = quizKeys(), last = ks[ks.length - 1], top = last.y + last.h + 14 * S, avail = H - top - 12 * S;
  if (avail > 36) {
    const fh = Math.min(64 * S, avail), fw = fh * 1.5, name = FLAGS[quiz.country][0], cap = 'Capital: ' + (CAPITALS[name] || '');
    const fs = Math.min(28 * S, fh * 0.46), fs2 = fs * 0.68;
    ctx.save();
    ctx.font = '800 ' + fs + 'px ' + FONT; const w1 = ctx.measureText(name).width;
    ctx.font = '700 ' + fs2 + 'px ' + FONT; const w2 = ctx.measureText(cap).width;
    ctx.restore();
    const gap = 18 * S, x0 = W / 2 - (fw + gap + Math.max(w1, w2)) / 2, cy = top + avail / 2;
    drawFlag(quiz.country, x0, cy - fh / 2, fw, fh);
    ctx.save(); ctx.textAlign = 'left'; ctx.textBaseline = 'middle';
    ctx.font = '800 ' + fs + 'px ' + FONT; ctx.fillStyle = '#ffffff'; ctx.shadowColor = '#ffd23f'; ctx.shadowBlur = 10;
    ctx.fillText(name, x0 + fw + gap, cy - fs * 0.5);
    ctx.shadowBlur = 0; ctx.font = '700 ' + fs2 + 'px ' + FONT; ctx.fillStyle = '#ffd23f';
    ctx.fillText(cap, x0 + fw + gap, cy + fs * 0.65);
    ctx.restore();
  }
}

function draw() {
  ctx.save();
  if (shake > 0) ctx.translate(rand(-1, 1) * shake * 14, rand(-1, 1) * shake * 14);
  drawBackground();
  drawHole();

  for (const p of powerups) drawPowerup(p);
  if (alien) drawAlien(alien);

  // glow layer
  ctx.globalCompositeOperation = 'lighter';
  for (const p of parts) {
    const a = 1 - p.life / p.max;
    ctx.globalAlpha = a; ctx.fillStyle = p.col;
    ctx.beginPath(); ctx.arc(p.x, p.y, Math.max(0.5, p.s * a), 0, TAU); ctx.fill();
  }
  ctx.globalAlpha = 1;
  for (const s of shocks) {
    const k = s.life / s.dur, r = s.r + (s.max - s.r) * k;
    ctx.strokeStyle = 'rgba(' + s.col + ',' + (1 - k) + ')'; ctx.lineWidth = 6 * (1 - k) + 1;
    ctx.beginPath(); ctx.arc(s.x, s.y, r, 0, TAU); ctx.stroke();
  }
  ctx.save();
  const lc = LASER[mult - 1];
  ctx.shadowColor = lc[0]; ctx.shadowBlur = 16 + mult * 3;
  ctx.strokeStyle = lc[1]; ctx.lineWidth = 3.5 + mult * 0.9; ctx.lineCap = 'round';
  ctx.beginPath();
  for (const b of bullets) { ctx.moveTo(b.x, b.y); ctx.lineTo(b.x - b.vx * 0.024, b.y - b.vy * 0.024); }
  ctx.stroke();
  ctx.restore();
  for (const sh of ally) {
    ctx.fillStyle = '#c8ffc8'; ctx.shadowColor = '#7dff9a'; ctx.shadowBlur = 18;
    ctx.beginPath(); ctx.arc(sh.x, sh.y, 6 * S, 0, TAU); ctx.fill();
  }
  ctx.shadowBlur = 0;
  if (beamT > 0 && state === 'play') {
    const bw = (30 + Math.sin(time * 30) * 6) * S * Math.min(1, beamT * 3), ry = rocketY();
    const g = ctx.createLinearGradient(0, ry, 0, 0);
    g.addColorStop(0, 'rgba(255,106,213,0.95)'); g.addColorStop(1, 'rgba(255,106,213,0.25)');
    ctx.fillStyle = g; ctx.fillRect(rx - bw / 2, 0, bw, ry - 30 * S);
    ctx.fillStyle = 'rgba(255,255,255,0.9)'; ctx.fillRect(rx - bw / 6, 0, bw / 3, ry - 30 * S);
  }
  ctx.globalCompositeOperation = 'source-over';

  for (const e of enemies) drawEnemy(e);
  if (boss) drawBoss(boss);
  drawFires();

  if (shield && state === 'play') {
    ctx.save();
    ctx.shadowColor = '#7dff9a'; ctx.shadowBlur = 22;
    ctx.strokeStyle = 'rgba(125,255,154,' + (0.7 + Math.sin(time * 8) * 0.25) + ')'; ctx.lineWidth = 5;
    ctx.beginPath(); ctx.moveTo(0, H - 8); ctx.lineTo(W, H - 8); ctx.stroke();
    ctx.restore();
  }

  if (state === 'play') {
    if (!(invuln > 0 && Math.floor(time * 14) % 2)) drawRocket(rx, rocketY(), skin, targetX - rx);
  } else if (state === 'start') {
    drawRocket(W / 2 + Math.sin(time * 1.3) * W * 0.12, rocketY(), skin, Math.cos(time * 1.3) * 40);
  } else {
    drawRocket(rx, rocketY(), skin, 0);
  }

  if (buddyT > 0 && state === 'play') {
    for (const d of [-1, 1]) {
      const bx = rx + d * 58 * S, by = rocketY() + 8 * S + Math.sin(time * 5 + d) * 4;
      ctx.save(); ctx.translate(bx, by); ctx.scale(S, S);
      ctx.shadowColor = '#b6ff6a'; ctx.shadowBlur = 14;
      ctx.fillStyle = '#e8ffd0'; ctx.beginPath(); ctx.moveTo(0, -16); ctx.lineTo(9, 10); ctx.lineTo(-9, 10); ctx.closePath(); ctx.fill();
      ctx.fillStyle = '#b6ff6a'; ctx.fillRect(-9, 8, 18, 4);
      ctx.fillStyle = '#ff7a1a'; ctx.beginPath(); ctx.moveTo(-4, 12); ctx.lineTo(0, 20 + Math.random() * 5); ctx.lineTo(4, 12); ctx.fill();
      ctx.restore();
    }
  }

  for (const t of texts) {
    ctx.globalAlpha = clamp(1.4 - t.life, 0, 1);
    drawText(t.str, clamp(t.x, 120, W - 120), t.y, 26 * S, t.col, t.col);
  }
  ctx.globalAlpha = 1;

  if (slowT > 0) { ctx.fillStyle = 'rgba(140,90,255,0.07)'; ctx.fillRect(0, 0, W, H); }
  if (flash > 0) { ctx.fillStyle = 'rgba(255,220,180,' + flash * 0.5 + ')'; ctx.fillRect(0, 0, W, H); }
  ctx.restore();

  // HUD
  if (state !== 'start') {
    ctx.save();
    ctx.font = '800 ' + Math.round(30 * S) + 'px ' + FONT;
    ctx.textBaseline = 'top'; ctx.fillStyle = '#fff'; ctx.shadowColor = '#7df9ff'; ctx.shadowBlur = 12;
    ctx.fillText('★ ' + score, 20, 16);
    ctx.textAlign = 'right'; ctx.font = '700 ' + Math.round(16 * S) + 'px ' + FONT;
    ctx.fillStyle = 'rgba(255,255,255,0.7)'; ctx.shadowBlur = 0;
    ctx.fillText('LEVEL ' + level + '   BEST ' + best, W - 20, 22);
    ctx.restore();
    ctx.fillStyle = 'rgba(255,255,255,0.12)'; ctx.fillRect(W - 140, 46 * S, 120, 5);
    ctx.fillStyle = boss || levelEnding ? '#ff6a2a' : '#7df9ff'; ctx.fillRect(W - 140, 46 * S, 120 * (levelEnding ? 1 : Math.min(1, levelTime / LEVEL_TIME)), 5);

    let by = 16 + 44 * S;
    for (let i = 0; i < MAX_LIVES; i++) {
      const hx = 32 + i * 30 * S, full = i < lives;
      ctx.save();
      if (full) { ctx.shadowColor = '#ff5f7e'; ctx.shadowBlur = 12; ctx.fillStyle = '#ff5f7e'; heartPath(hx, by + 10 * S, 10 * S); ctx.fill(); }
      else { ctx.strokeStyle = 'rgba(255,255,255,0.25)'; ctx.lineWidth = 2; heartPath(hx, by + 10 * S, 10 * S); ctx.stroke(); }
      ctx.restore();
    }
    by += 28 * S;
    if (combo >= 2) {
      ctx.save();
      ctx.font = '800 ' + Math.round(16 * S) + 'px ' + FONT; ctx.textBaseline = 'top';
      ctx.fillStyle = LASER[mult - 1][0]; ctx.shadowColor = LASER[mult - 1][0]; ctx.shadowBlur = 10;
      ctx.fillText('COMBO ' + combo + '  x' + mult, 20, by);
      ctx.restore();
      const into = mult >= 5 ? 5 : combo % 5;
      ctx.fillStyle = 'rgba(255,255,255,0.12)'; ctx.fillRect(20, by + 24 * S, 120, 5);
      ctx.fillStyle = LASER[mult - 1][0]; ctx.fillRect(20, by + 24 * S, 120 * (into / 5), 5);
      by += 38 * S;
    }
    const bar = (t, max, col) => {
      ctx.fillStyle = 'rgba(255,255,255,0.12)'; ctx.fillRect(20, by, 120, 6);
      ctx.fillStyle = col; ctx.fillRect(20, by, 120 * (t / max), 6); by += 12;
    };
    if (tripleT > 0) bar(tripleT, 20, '#7df9ff');
    if (slowT > 0) bar(slowT, 6, '#c59bff');
    if (doubleT > 0) bar(doubleT, 20, '#ffb36a');
    if (rapidT > 0) bar(rapidT, 8, '#ffe36b');
    if (beamT > 0) bar(beamT, 4, '#ff6ad5');
    if (magnetT > 0) bar(magnetT, 9, '#6ab7ff');
    if (buddyT > 0) bar(buddyT, 12, '#b6ff6a');

    if (boss) drawBossBar(boss);
  }

  if (quiz) drawQuiz();

  if (state === 'start') {
    const ty = H * 0.46;
    drawLogo(W / 2, ty + 22 * S, 48 * S);
    ctx.globalAlpha = 0.6 + Math.sin(time * 4) * 0.4;
    drawText('Tap to start', W / 2, ty + 128 * S, 24 * S, '#ffffff');
    ctx.globalAlpha = 1;
    drawText('Blast the rocks  ·  catch the stars  ·  keep your hearts', W / 2, ty + 166 * S, 15 * S, 'rgba(255,255,255,0.65)');
    drawText('★ ' + totalStars + ' stars collected', W / 2, ty + 190 * S, 15 * S, '#ffe36b');
  } else if (state === 'over') {
    ctx.fillStyle = 'rgba(0,0,0,' + Math.min(0.55, overT) + ')'; ctx.fillRect(0, 0, W, H);
    const ty = H * 0.44;
    drawText('GAME OVER', W / 2, ty, 60 * S, '#ffffff', '#ff3b3b');
    drawText('★ ' + score, W / 2, ty + 70 * S, 44 * S, '#ffe36b', '#ffd84a');
    if (score >= best && score > 0) drawText('New best', W / 2, ty + 112 * S, 20 * S, '#7dff9a');
    if (overT > 0.9) {
      ctx.globalAlpha = 0.6 + Math.sin(time * 4) * 0.4;
      drawText('Tap to play again', W / 2, ty + 160 * S, 24 * S, '#ffffff');
      ctx.globalAlpha = 1;
    }
    drawText('+' + runStars + ' stars caught  ·  ' + totalStars + ' in total', W / 2, ty + 205 * S, 16 * S, '#ffe36b');
  }
}

/* ---------- loop ---------- */
let last = performance.now();
function frame(now) {
  const dt = Math.min(0.05, (now - last) / 1000); last = now;
  update(dt); draw(); drawMusicBtn();
  requestAnimationFrame(frame);
}
rx = targetX = W / 2; ry0 = targetY = H - 78 * S;
requestAnimationFrame(frame);
})();
</script>
